<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>ShelfScan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --green: #00e676;
  --amber: #ffab00;
  --red: #ff1744;
  --bg: #000;
  --overlay: rgba(0,0,0,0.55);
  --bar-h: 56px;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: 'SF Pro Display', -apple-system, 'Helvetica Neue', sans-serif;
  overflow: hidden;
  touch-action: none;
}

/* ── Screens ── */
.screen { position: fixed; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* ── START SCREEN ── */
#screen-start {
  background: #0a0a0a;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 2rem;
}

.logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.25em;
  color: var(--green);
  margin-bottom: 3rem;
  text-transform: uppercase;
}

.start-title {
  font-size: 2rem;
  font-weight: 700;
  color: #fff;
  text-align: center;
  line-height: 1.1;
  margin-bottom: 0.75rem;
  letter-spacing: -0.03em;
}

.start-sub {
  font-size: 14px;
  color: #666;
  text-align: center;
  line-height: 1.5;
  margin-bottom: 3rem;
  max-width: 280px;
}

.shelf-types {
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 2rem;
}

.type-btn {
  width: 100%;
  background: #161616;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px 18px;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: border-color 0.15s, background 0.15s;
  -webkit-appearance: none;
}

.type-btn .icon {
  font-size: 20px;
  width: 36px;
  height: 36px;
  background: #222;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.type-btn .type-info { flex: 1; }
.type-btn .type-name { font-size: 15px; font-weight: 600; }
.type-btn .type-desc { font-size: 12px; color: #666; margin-top: 1px; }

.type-btn.selected {
  border-color: var(--green);
  background: rgba(0,230,118,0.06);
}
.type-btn.selected .icon { background: rgba(0,230,118,0.15); }

.start-btn {
  width: 100%;
  max-width: 340px;
  background: var(--green);
  color: #000;
  border: none;
  border-radius: 14px;
  padding: 17px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.01em;
  transition: opacity 0.15s;
}
.start-btn:active { opacity: 0.85; }

/* ── CAMERA SCREEN ── */
#screen-camera {
  background: #000;
  position: relative;
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#canvas-hidden { display: none; }

/* Top bar */
.cam-top {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
}

.cam-back {
  background: rgba(255,255,255,0.12);
  border: none;
  border-radius: 20px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  padding: 7px 14px;
  cursor: pointer;
}

.cam-shelf-label {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.cam-count {
  font-size: 13px;
  font-weight: 700;
  color: var(--green);
  min-width: 40px;
  text-align: right;
}

/* Viewfinder overlay */
.vf-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* Corner brackets */
.bracket {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: #fff;
  border-style: solid;
  opacity: 0.7;
  transition: border-color 0.3s, opacity 0.3s;
}
.bracket.tl { top: 22%; left: 6%; border-width: 2.5px 0 0 2.5px; border-radius: 3px 0 0 0; }
.bracket.tr { top: 22%; right: 6%; border-width: 2.5px 2.5px 0 0; border-radius: 0 3px 0 0; }
.bracket.bl { bottom: 28%; left: 6%; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 3px; }
.bracket.br { bottom: 28%; right: 6%; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 3px 0; }

.bracket.ready { border-color: var(--green); opacity: 1; }
.bracket.warn   { border-color: var(--amber); opacity: 0.9; }
.bracket.fail   { border-color: var(--red); opacity: 0.9; }

/* Check pills — live indicators */
.checks-bar {
  position: absolute;
  bottom: 36%;
  left: 0; right: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 16px;
  pointer-events: none;
}

.check-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.65);
  border-radius: 20px;
  padding: 6px 12px 6px 8px;
  width: fit-content;
  max-width: 100%;
  backdrop-filter: blur(6px);
  transition: opacity 0.2s;
}

.check-pill.pass { opacity: 0.7; }
.check-pill.warn { opacity: 1; }
.check-pill.fail { opacity: 1; }

.pill-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.3s;
}
.pass .pill-dot { background: var(--green); }
.warn .pill-dot { background: var(--amber); }
.fail .pill-dot { background: var(--red); }

.pill-text {
  font-size: 12px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
}

/* Bottom controls */
.cam-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 10;
  padding: 20px 24px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
}

/* Shutter */
.shutter-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.shutter-ring {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.3s;
}
.shutter-ring.ready { border-color: var(--green); }

#shutter-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #fff;
  border: none;
  cursor: pointer;
  transition: background 0.3s, transform 0.1s;
  position: relative;
}
#shutter-btn:disabled { background: #555; cursor: not-allowed; }
#shutter-btn.ready { background: var(--green); }
#shutter-btn:active:not(:disabled) { transform: scale(0.92); }

/* Flash feedback */
.flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  z-index: 100;
  pointer-events: none;
  transition: opacity 0.05s;
}
.flash.on { opacity: 1; }

/* ── SUCCESS SCREEN ── */
#screen-success {
  background: #000;
  align-items: center;
  justify-content: center;
  gap: 0;
}

.success-preview {
  width: 100%;
  flex: 1;
  position: relative;
  overflow: hidden;
}

#captured-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.success-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 50%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 28px 24px;
  padding-bottom: max(28px, env(safe-area-inset-bottom));
  gap: 12px;
}

.success-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.success-check {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: #000;
  font-weight: 700;
  flex-shrink: 0;
}

.success-title {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
}

.success-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 4px;
}

.success-scores {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.score-chip {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--green);
  font-weight: 600;
  backdrop-filter: blur(4px);
}

.success-actions {
  display: flex;
  gap: 10px;
}

.btn-next {
  flex: 1;
  background: var(--green);
  color: #000;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-next:active { opacity: 0.85; }

.btn-retake {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 16px 20px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

/* ── DONE SCREEN ── */
#screen-done {
  background: #0a0a0a;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  gap: 0;
}

.done-icon {
  font-size: 3rem;
  margin-bottom: 1.5rem;
}

.done-title {
  font-size: 1.8rem;
  font-weight: 700;
  color: #fff;
  text-align: center;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}

.done-sub {
  font-size: 14px;
  color: #666;
  text-align: center;
  margin-bottom: 2.5rem;
}

.done-count {
  font-size: 48px;
  font-weight: 700;
  color: var(--green);
  text-align: center;
  line-height: 1;
  margin-bottom: 0.3rem;
}

.done-count-label {
  font-size: 13px;
  color: #555;
  text-align: center;
  margin-bottom: 3rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.done-restart {
  width: 100%;
  max-width: 300px;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  color: #fff;
  border-radius: 12px;
  padding: 15px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,230,118,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(0,230,118,0); }
}
.shutter-ring.ready { animation: pulse-green 2s infinite; }
</style>
</head>
<body>

<!-- ── START SCREEN ── -->
<div class="screen active" id="screen-start">
  <div class="logo">ShelfScan</div>
  <h1 class="start-title">What shelf<br>are you shooting?</h1>
  <p class="start-sub">The camera will guide you to the right angle and distance.</p>

  <div class="shelf-types">
    <button class="type-btn selected" data-type="upright" onclick="selectType(this)">
      <div class="icon">&#x1F9F4;</div>
      <div class="type-info">
        <div class="type-name">Upright shelf</div>
        <div class="type-desc">Bottles, jars, cans, boxes</div>
      </div>
    </button>
    <button class="type-btn" data-type="pegboard" onclick="selectType(this)">
      <div class="icon">&#x1F4CB;</div>
      <div class="type-info">
        <div class="type-name">Pegboard / hooks</div>
        <div class="type-desc">Blister packs, hanging bags</div>
      </div>
    </button>
    <button class="type-btn" data-type="flatbags" onclick="selectType(this)">
      <div class="icon">&#x1F6CD;</div>
      <div class="type-info">
        <div class="type-name">Flat stacked bags</div>
        <div class="type-desc">Rice, beans, lentils — shoot from above</div>
      </div>
    </button>
  </div>

  <button class="start-btn" onclick="startCamera()">Open Camera</button>
</div>

<!-- ── CAMERA SCREEN ── -->
<div class="screen" id="screen-camera">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas-hidden"></canvas>
  <div class="flash" id="flash"></div>

  <!-- Top bar -->
  <div class="cam-top">
    <button class="cam-back" onclick="goBack()">&#8592; Back</button>
    <div class="cam-shelf-label" id="shelf-label">UPRIGHT</div>
    <div class="cam-count" id="photo-count">0 saved</div>
  </div>

  <!-- Viewfinder brackets -->
  <div class="vf-overlay">
    <div class="bracket tl" id="b-tl"></div>
    <div class="bracket tr" id="b-tr"></div>
    <div class="bracket bl" id="b-bl"></div>
    <div class="bracket br" id="b-br"></div>
  </div>

  <!-- Live check pills -->
  <div class="checks-bar" id="checks-bar">
    <div class="check-pill" id="pill-distance">
      <div class="pill-dot"></div>
      <div class="pill-text">Checking...</div>
    </div>
    <div class="check-pill" id="pill-tilt">
      <div class="pill-dot"></div>
      <div class="pill-text">Checking tilt...</div>
    </div>
    <div class="check-pill" id="pill-sharp">
      <div class="pill-dot"></div>
      <div class="pill-text">Checking focus...</div>
    </div>
    <div class="check-pill" id="pill-glare">
      <div class="pill-dot"></div>
      <div class="pill-text">Checking glare...</div>
    </div>
  </div>

  <!-- Shutter -->
  <div class="cam-bottom">
    <div class="shutter-wrap">
      <div class="shutter-ring" id="shutter-ring">
        <button id="shutter-btn" disabled onclick="capturePhoto()"></button>
      </div>
    </div>
  </div>
</div>

<!-- ── SUCCESS SCREEN ── -->
<div class="screen" id="screen-success">
  <div class="success-preview">
    <img id="captured-img" alt="Captured shelf">
    <div class="success-overlay">
      <div class="success-badge">
        <div class="success-check">&#10003;</div>
        <div class="success-title">Photo saved</div>
      </div>
      <div class="success-scores" id="success-scores"></div>
      <div class="success-sub" id="success-sub">Saved to your camera roll</div>
      <div class="success-actions">
        <button class="btn-retake" onclick="retake()">Retake</button>
        <button class="btn-next" onclick="nextShelf()">Next shelf &#8594;</button>
      </div>
    </div>
  </div>
</div>

<!-- ── DONE SCREEN ── -->
<div class="screen" id="screen-done">
  <div class="done-icon">&#x2713;</div>
  <h2 class="done-title">Session complete</h2>
  <p class="done-sub">All photos saved to your camera roll</p>
  <div class="done-count" id="done-count">0</div>
  <div class="done-count-label">photos captured</div>
  <button class="done-restart" onclick="restart()">Start new session</button>
</div>

<script>
// ── State ──
let shelfType = 'upright';
let stream = null;
let analyzeInterval = null;
let photoCount = 0;
let lastScores = {};
let allPass = false;
let tiltBeta = 0, tiltGamma = 0;
let orientationGranted = false;

const LABELS = { upright: 'UPRIGHT', pegboard: 'PEGBOARD', flatbags: 'FLAT BAGS' };

// ── Shelf type selection ──
function selectType(btn) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  shelfType = btn.dataset.type;
}

// ── Screen management ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Camera start ──
async function startCamera() {
  try {
    const constraints = {
      video: {
        facingMode: 'environment',
        width: { ideal: 3840 },
        height: { ideal: 2160 }
      }
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('video').srcObject = stream;
    document.getElementById('shelf-label').textContent = LABELS[shelfType];
    document.getElementById('photo-count').textContent = photoCount + ' saved';
    showScreen('screen-camera');
    requestOrientationPermission();
    startAnalysis();
  } catch (e) {
    alert('Camera access required. Please allow camera access and try again.');
  }
}

// ── Device orientation ──
function requestOrientationPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(r => { if (r === 'granted') listenOrientation(); })
      .catch(() => {});
  } else {
    listenOrientation();
  }
}

function listenOrientation() {
  orientationGranted = true;
  window.addEventListener('deviceorientation', e => {
    tiltBeta = e.beta || 0;
    tiltGamma = e.gamma || 0;
  });
}

// ── Live analysis ──
function startAnalysis() {
  analyzeInterval = setInterval(analyze, 250);
}

function stopAnalysis() {
  if (analyzeInterval) { clearInterval(analyzeInterval); analyzeInterval = null; }
}

function analyze() {
  const video = document.getElementById('video');
  if (video.readyState < 2) return;

  const canvas = document.getElementById('canvas-hidden');
  const W = 320, H = 240; // small sample for perf
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;

  const scores = {
    distance: checkDistance(data, W, H),
    tilt:     checkTilt(),
    sharp:    checkSharpness(data, W, H),
    glare:    checkGlare(data, W, H)
  };

  lastScores = scores;
  updateUI(scores);
}

function checkDistance(data, W, H) {
  // Proxy: measure edge density in center zone — more edges = closer = more detail
  // Simple brightness variance in center strip
  const cx = Math.floor(W * 0.25), cy = Math.floor(H * 0.25);
  const cw = Math.floor(W * 0.5), ch = Math.floor(H * 0.5);
  let sum = 0, count = 0;
  for (let y = cy; y < cy + ch; y++) {
    for (let x = cx; x < cx + cw; x++) {
      const i = (y * W + x) * 4;
      sum += (data[i] + data[i+1] + data[i+2]) / 3;
      count++;
    }
  }
  const mean = sum / count;
  let variance = 0;
  for (let y = cy; y < cy + ch; y++) {
    for (let x = cx; x < cx + cw; x++) {
      const i = (y * W + x) * 4;
      const gray = (data[i] + data[i+1] + data[i+2]) / 3;
      variance += (gray - mean) ** 2;
    }
  }
  variance /= count;
  // High variance = lots of detail = probably close enough
  if (variance > 900) return { status: 'pass', msg: 'Distance OK' };
  if (variance > 400) return { status: 'warn', msg: 'Move closer' };
  return { status: 'fail', msg: 'Too far — move to 2-3 ft' };
}

function checkTilt() {
  if (!orientationGranted) return { status: 'pass', msg: 'Hold steady' };

  if (shelfType === 'flatbags') {
    // Want phone angled ~45° downward — beta around 45-70
    const beta = Math.abs(tiltBeta);
    if (beta >= 35 && beta <= 75) return { status: 'pass', msg: 'Angle OK for flat bags' };
    if (beta < 35) return { status: 'warn', msg: 'Tilt down more (45°)' };
    return { status: 'warn', msg: 'Tilt back slightly' };
  } else {
    // Want phone roughly vertical and level — beta near 90, gamma near 0
    const vertOff = Math.abs(tiltBeta - 90);
    const sideOff = Math.abs(tiltGamma);
    if (vertOff < 15 && sideOff < 10) return { status: 'pass', msg: 'Level and straight' };
    if (sideOff >= 10) return { status: 'warn', msg: 'Straighten sideways tilt' };
    return { status: 'warn', msg: 'Keep phone upright' };
  }
}

function checkSharpness(data, W, H) {
  // Laplacian-like: sum absolute differences between adjacent pixels
  let edgeSum = 0, count = 0;
  for (let y = 1; y < H - 1; y += 2) {
    for (let x = 1; x < W - 1; x += 2) {
      const i = (y * W + x) * 4;
      const il = (y * W + (x-1)) * 4;
      const ir = (y * W + (x+1)) * 4;
      const iu = ((y-1) * W + x) * 4;
      const id = ((y+1) * W + x) * 4;
      const c  = (data[i]  + data[i+1]  + data[i+2])  / 3;
      const l  = (data[il] + data[il+1] + data[il+2]) / 3;
      const r  = (data[ir] + data[ir+1] + data[ir+2]) / 3;
      const u  = (data[iu] + data[iu+1] + data[iu+2]) / 3;
      const d  = (data[id] + data[id+1] + data[id+2]) / 3;
      edgeSum += Math.abs(2*c - l - r) + Math.abs(2*c - u - d);
      count++;
    }
  }
  const score = edgeSum / count;
  if (score > 18) return { status: 'pass', msg: 'Sharp — tap label to lock focus' };
  if (score > 9)  return { status: 'warn', msg: 'Slightly soft — tap screen to focus' };
  return { status: 'fail', msg: 'Blurry — tap a label to focus' };
}

function checkGlare(data, W, H) {
  let bright = 0, total = W * H;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) bright++;
  }
  const pct = bright / total * 100;
  if (pct < 1.5) return { status: 'pass', msg: 'No glare' };
  if (pct < 4)   return { status: 'warn', msg: 'Minor glare — reposition' };
  return { status: 'fail', msg: 'Glare detected — move or turn off flash' };
}

// ── UI update ──
function updateUI(scores) {
  const pills = [
    { id: 'pill-distance', s: scores.distance },
    { id: 'pill-tilt',     s: scores.tilt },
    { id: 'pill-sharp',    s: scores.sharp },
    { id: 'pill-glare',    s: scores.glare },
  ];

  pills.forEach(({ id, s }) => {
    const el = document.getElementById(id);
    el.className = 'check-pill ' + s.status;
    el.querySelector('.pill-text').textContent = s.msg;
  });

  const passes = Object.values(scores).filter(s => s.status === 'pass').length;
  const fails  = Object.values(scores).filter(s => s.status === 'fail').length;
  allPass = fails === 0 && passes >= 3;

  const bracketClass = fails > 0 ? 'fail' : passes < 4 ? 'warn' : 'ready';
  ['b-tl','b-tr','b-bl','b-br'].forEach(id => {
    const el = document.getElementById(id);
    el.className = 'bracket ' + id.split('-')[1] + ' ' + bracketClass;
  });

  const ring = document.getElementById('shutter-ring');
  const btn  = document.getElementById('shutter-btn');
  if (allPass) {
    ring.className = 'shutter-ring ready';
    btn.className  = 'ready';
    btn.disabled   = false;
  } else {
    ring.className = 'shutter-ring';
    btn.className  = '';
    btn.disabled   = true;
  }
}

// ── Capture ──
function capturePhoto() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas-hidden');
  canvas.width  = video.videoWidth  || 1920;
  canvas.height = video.videoHeight || 1080;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  // Flash feedback
  const flash = document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 120);

  const dataURL = canvas.toDataURL('image/jpeg', 0.95);

  // Save to camera roll
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = `shelf_${shelfType}_${Date.now()}.jpg`;
  a.click();

  photoCount++;
  document.getElementById('photo-count').textContent = photoCount + ' saved';

  // Show success screen
  stopAnalysis();
  document.getElementById('captured-img').src = dataURL;

  // Score summary chips
  const chips = Object.entries(lastScores).map(([k, v]) => {
    const label = { distance:'Distance', tilt:'Level', sharp:'Focus', glare:'Glare' }[k];
    return `<div class="score-chip">${label} &#10003;</div>`;
  }).join('');
  document.getElementById('success-scores').innerHTML = chips;
  document.getElementById('success-sub').textContent =
    `Photo ${photoCount} saved to camera roll`;

  showScreen('screen-success');
}

// ── Navigation ──
function retake() {
  photoCount = Math.max(0, photoCount - 1);
  document.getElementById('photo-count').textContent = photoCount + ' saved';
  showScreen('screen-camera');
  startAnalysis();
}

function nextShelf() {
  showScreen('screen-camera');
  startAnalysis();
}

function goBack() {
  stopAnalysis();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  showScreen('screen-start');
}

function finishSession() {
  stopAnalysis();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('done-count').textContent = photoCount;
  showScreen('screen-done');
}

function restart() {
  photoCount = 0;
  shelfType  = 'upright';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('[data-type="upright"]').classList.add('selected');
  showScreen('screen-start');
}

// ── Prevent scroll bounce on iOS ──
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
